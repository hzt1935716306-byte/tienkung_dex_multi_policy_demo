[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tienkung-dex-multi-policy-demo"
version = "0.1.0"
description = "Standalone MuJoCo demos for TienKung Dex locomotion, motion policies, and voice commands"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=1.24,<2",
  "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
voice = [
  "dashscope>=1.20",
  "pyaudio>=0.2.14",
  "websocket-client>=1.8",
]
analysis = [
  "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
